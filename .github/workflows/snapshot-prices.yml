name: Snapshot poe.ninja prices

# BRIEF.md §6: prices are snapshotted by a cron, never fetched from the browser.
# Every 6 hours is well inside poe.ninja's 30-minute cache window. A successful run that
# commits a change triggers deploy.yml through its workflow_run trigger.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

# A manual dispatch near the cron must queue behind it, not race it to the same commit.
concurrency:
  group: snapshot-prices
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Restore the ETag store and body cache so runs send If-None-Match and can get 304s
      # instead of re-downloading the 8.5 MB BaseType body every time. Each run saves a new
      # cache under its own key; restore-keys picks the most recent one.
      - uses: actions/cache@v4
        with:
          path: .cache/ninja
          key: ninja-cache-${{ github.run_id }}
          restore-keys: |
            ninja-cache-
      - run: npm run snapshot-prices -- --league Allflame
      # The script rewrites the timestamps on every run that reaches the network, so this commits
      # on every such run; the diff is only empty when the 30-minute guard stopped the script.
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/prices
          git diff --cached --quiet && echo "no price change" && exit 0
          git commit -m "prices: snapshot $(date -u +'%d/%m/%Y %H:%M') UTC"
          git pull --rebase
          git push
